<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DiskClean 密钥生成器</title>
<style>
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fa;display:flex;justify-content:center;padding-top:60px;margin:0}
.card{background:#fff;border-radius:14px;padding:28px;width:420px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:20px;color:#0067c0;margin:0 0 4px}
.sub{font-size:12px;color:#889;margin-bottom:18px}
label{font-size:13px;color:#445;display:block;margin:12px 0 4px}
input,select{width:100%;padding:10px;border:1px solid #ccd;border-radius:8px;font-size:14px;box-sizing:border-box}
button{width:100%;margin-top:18px;background:#0067c0;color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
#out{display:none;margin-top:16px;background:#f0f6fc;border:1px solid #bcd6f0;border-radius:10px;padding:14px}
#key{font-size:16px;font-weight:700;letter-spacing:1px;color:#0067c0;word-break:break-all;font-family:Consolas,monospace}
#copy{margin-top:10px;background:#fff;color:#0067c0;border:1px solid #0067c0}
.note{font-size:11px;color:#aab;margin-top:16px}
#gate{position:fixed;inset:0;background:#f5f7fa;display:flex;justify-content:center;align-items:center;z-index:99}
#gate .card{width:340px}
.pw-msg{font-size:13px;color:#c0392b;margin-top:10px;display:none}
.guard-err{position:relative;z-index:100;background:#fdecea;border:1px solid #f5b7b1;color:#a93226;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.h{font-size:15px;color:#445;margin:22px 0 8px}
#hist-active .row,#hist-expired .row{display:flex;align-items:center;gap:8px;background:#fafbfc;border:1px solid #e3e8ee;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px}
#hist-active .ktag{color:#0067c0;font-weight:600;min-width:96px}
#hist-active .kkey{font-family:Consolas,monospace;font-size:12px;color:#334;flex:1;word-break:break-all}
#hist-active .krem{color:#2e9e5b;white-space:nowrap}
#hist-active .kbound{color:#2e9e5b;font-size:11px;white-space:nowrap}
#hist-expired .row{opacity:.55}
#hist-expired .kkey{font-family:Consolas,monospace;font-size:12px;flex:1;word-break:break-all}
.mini{background:#fff;border:1px solid #ccd;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
.danger{background:#fff;color:#a93226;border-color:#f5b7b1}
.note2{font-size:11px;color:#889;margin-top:4px}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <h1>🔒 管理密码</h1>
    <div class="sub">本页内含主密钥，仅限服务方使用</div>
    <input id="pw" type="password" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')tryUnlock()">
    <button onclick="tryUnlock()">解锁</button>
    <div id="pw-msg" class="pw-msg">密码错误</div>
  </div>
</div>
<div id="guard-err" hidden>⚠ 此页面未注入主密钥（勿直接打开模板文件），请使用构建产物 dist/keygen.html</div>
<div class="card">
  <h1>🧹 DiskClean 密钥生成器</h1>
  <div class="sub">主密钥指纹：<b id="fp">-</b>（与程序管理面板指纹一致即为同步）</div>
  <div class="sub">仅供服务方使用 · 请勿外传本页面（内含主密钥）</div>
  <div class="sub">本机时间：<b id="nowtime">-</b>（密钥按本机时钟签发，请保持时钟准确）</div>
  <label>客户备注（便于辨认，不会显示给客户）</label>
  <input id="tag" placeholder="如：王先生-联想笔记本">
  <label>有效期（天）</label>
  <select id="days">
    <option value="1" selected>1 天</option>
    <option value="2">2 天</option>
    <option value="3">3 天</option>
    <option value="7">7 天</option>
    <option value="30">30 天</option>
  </select>
  <div class="note2">1 天 = 生成时刻起整 24 小时（精确到分钟）</div>
  <label>客户设备码（可选，绑定后仅该设备可用）</label>
  <input id="device" placeholder="客户程序界面显示的设备码，如 a1b2c3d4-e5f6-…">
  <div class="note2" id="device-hint" hidden></div>
  <button id="gen" onclick="doGen()">生成密钥</button>
  <div id="out">
    <div id="key"></div>
    <button id="copy" onclick="copyKey()">复制密钥</button>
  </div>
  <div class="h">历史密钥（本机浏览器存储）</div>
  <div id="hist-active"></div>
  <details id="hist-expired-box" hidden><summary style="font-size:12px;color:#889;cursor:pointer">已过期密钥</summary><div id="hist-expired"></div><button class="mini danger" onclick="clearExpired()">清空过期记录</button></details>
  <div class="note">密钥在有效期内可反复使用。填写设备码后仅该设备可用（其他设备会提示已绑定）；不填则任意设备可用。过期后需重新生成。</div>
</div>

<script id="dkc-algo">
// ==== 与 src/license.js 一致的算法实现（纯 JS，无外部依赖）====
// 警告：修改本段算法后必须运行 node --test test/keygen-cross.test.js 交叉验证，
// 否则可能生成客户无法使用的密钥（密钥格式与 license.js 位级一致是硬约束）。
(function () {
  function hmacSha256(keyHex, msgBytes) {
    var key = new Uint8Array(keyHex.length / 2);
    for (var i = 0; i < key.length; i++) key[i] = parseInt(keyHex.substr(i * 2, 2), 16);
    if (key.length > 64) key = sha256(key);
    var ipad = new Uint8Array(64), opad = new Uint8Array(64);
    for (var j = 0; j < 64; j++) { ipad[j] = 0x36; opad[j] = 0x5c; }
    for (var k = 0; k < key.length; k++) { ipad[k] ^= key[k]; opad[k] ^= key[k]; }
    var inner = sha256(concat(ipad, msgBytes));
    return sha256(concat(opad, inner));
  }
  function sha256(msg) {
    var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var l = msg.length * 8;
    var padded = new Uint8Array(((msg.length + 8) >> 6 << 6) + 64);
    padded.set(msg);
    padded[msg.length] = 0x80;
    var dv = new DataView(padded.buffer);
    dv.setUint32(padded.length - 8, Math.floor(l / 4294967296));
    dv.setUint32(padded.length - 4, l >>> 0);
    var w = new Uint32Array(64);
    for (var off = 0; off < padded.length; off += 64) {
      for (var t = 0; t < 16; t++) w[t] = dv.getUint32(off + t * 4);
      for (var s = 16; s < 64; s++) {
        var w15 = w[s - 15], w2 = w[s - 2];
        var s0 = rotr(w15, 7) ^ rotr(w15, 18) ^ (w15 >>> 3);
        var s1 = rotr(w2, 17) ^ rotr(w2, 19) ^ (w2 >>> 10);
        w[s] = (w[s - 16] + s0 + w[s - 7] + s1) >>> 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (var q = 0; q < 64; q++) {
        var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K[q] + w[q]) >>> 0;
        var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    var out = new Uint8Array(32);
    for (var r = 0; r < 8; r++) { out[r * 4] = H[r] >>> 24; out[r * 4 + 1] = H[r] >>> 16 & 0xff; out[r * 4 + 2] = H[r] >>> 8 & 0xff; out[r * 4 + 3] = H[r] & 0xff; }
    return out;
  }
  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  function concat(a, b) { var out = new Uint8Array(a.length + b.length); out.set(a); out.set(b, a.length); return out; }

  var ALPHABET = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  var EPOCH = Date.UTC(2026, 0, 1);
  var DAY_MS = 86400000;
  var MASTER = '__MASTER_KEY__';
  var PASS_HASH = '7284519dd9c9a67a36e87a20a3e89dd0bed7ff84caf276994820b7191a4d6301';

  function packBits(bits) {
    // BigInt 实现：JS 位运算 32 位截断，56 bits 会溢出（Task 2 已实测）
    var buf = 0n, used = 0; var bytes = [];
    for (var i = 0; i < bits.length; i++) { buf = (buf << BigInt(bits[i][1])) | BigInt(bits[i][0]); used += bits[i][1]; }
    var pad = (8 - (used % 8)) % 8; buf <<= BigInt(pad); used += pad;
    for (var j = used - 8; j >= 0; j -= 8) bytes.push(Number((buf >> BigInt(j)) & 0xffn));
    return bytes;
  }
  function b32encode(bytes) {
    var bits = '';
    for (var i = 0; i < bytes.length; i++) bits += ('00000000' + bytes[i].toString(2)).slice(-8);
    var s = '';
    for (var j = 0; j + 5 <= bits.length; j += 5) s += ALPHABET[parseInt(bits.slice(j, j + 5), 2)];
    return s;
  }
  // 设备码归一化：与 license.js normalizeDeviceCode 一致（大小写/连字符/花括号忽略）
  function normalizeDeviceCode(s) { return String(s).toLowerCase().replace(/[^0-9a-f]/g, ''); }
  function deviceHash(code) {
    var h = sha256(new TextEncoder().encode(normalizeDeviceCode(code))); // sha256 前 2 字节（16-bit tagHash）
    return (h[0] << 8) | h[1];
  }
  function generate(opts) {
    opts = opts || {};
    var issueTime = Math.floor((opts.issueTime || Date.now()) / 60000) * 60000; // 分钟取整，与 license.js 一致
    var validDays = Math.max(1, Math.min(63, Math.floor(opts.validDays || 1)));
    var issueDay = Math.floor((issueTime - EPOCH) / DAY_MS);
    var withinDay = (issueTime - EPOCH) % DAY_MS;
    var issueHour = Math.floor(withinDay / 3600000);
    var issueMinute = Math.floor((withinDay % 3600000) / 60000);
    var deviceCode = opts.deviceCode ? normalizeDeviceCode(opts.deviceCode) : '';
    var version = deviceCode ? 3 : 2; // 设备绑定 → v3（tagHash 校验）；否则 v2（tagHash 忽略）
    var payload = packBits([[version, 2], [issueDay, 16], [validDays, 6], [deviceCode ? deviceHash(deviceCode) : 0, 16], [issueHour, 5], [issueMinute, 6], [0, 1]]);
    var sig = hmacSha256(MASTER, new Uint8Array(payload)).slice(0, 3);
    var full = payload.concat(Array.prototype.slice.call(sig)); // Uint8Array 转普通数组再拼接
    var body = b32encode(full);
    var b16 = body.slice(0, 16);
    return 'DKC-' + b16.slice(0, 4) + '-' + b16.slice(4, 8) + '-' + b16.slice(8, 12) + '-' + b16.slice(12, 16);
  }
  function sha256HexText(str) {
    var d = sha256(new TextEncoder().encode(String(str)));
    var s = '';
    for (var i = 0; i < d.length; i++) s += ('0' + d[i].toString(16)).slice(-2);
    return s;
  }
  function remainingMs(issueTime, validDays, now) {
    return issueTime + validDays * DAY_MS - (now || Date.now());
  }
  var masterOk = /^[0-9a-f]{64}$/.test(MASTER);
  (typeof window !== 'undefined' ? window : globalThis).dkcAlgo = {
    generate: generate,
    normalizeDeviceCode: normalizeDeviceCode,
    sha256HexText: sha256HexText,
    remainingMs: remainingMs,
    masterOk: masterOk,
    fingerprint: masterOk ? MASTER.slice(0, 8) : '',
    PASS_HASH: PASS_HASH
  };
})();
</script>

<script>
var HIST_KEY = 'dkcKeygenHistory';
var GATE_KEY = 'dkcKeygenUnlocked';

function hist() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { return []; }
}
function histSave(list) { try { localStorage.setItem(HIST_KEY, JSON.stringify(list)); } catch (e) {} }

function fmtDT(ts) {
  var d = new Date(ts);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function fmtRem(ms) {
  if (ms <= 0) return '已过期';
  if (ms < 3600000) return '不足 1 小时';
  var days = Math.floor(ms / 86400000), hours = Math.floor((ms % 86400000) / 3600000);
  return (days > 0 ? days + '天' : '') + (hours > 0 || days === 0 ? hours + '小时' : '');
}

function renderHistory() {
  var list = hist();
  var now = Date.now();
  var act = [], exp = [];
  for (var i = 0; i < list.length; i++) {
    var rem = window.dkcAlgo.remainingMs(list[i].issueTime, list[i].validDays, now);
    (rem > 0 ? act : exp).push({ e: list[i], rem: rem });
  }
  act.sort(function (a, b) { return a.rem - b.rem; });
  var actBox = document.getElementById('hist-active');
  actBox.innerHTML = '';
  for (var j = 0; j < act.length; j++) {
    var row = act[j], it = row.e;
    var div = document.createElement('div');
    div.className = 'row';
    var expTs = it.issueTime + it.validDays * 86400000;
    div.innerHTML = '<div class="ktag">' + esc(it.tag || '（无备注）') + '</div>' +
      (it.deviceCode ? '<span class="kbound">已绑定 ' + esc(it.deviceCode.slice(0, 8)) + '…</span>' : '') +
      '<div class="kkey">' + esc(it.key) + '</div>' +
      '<div class="krem">剩余 ' + fmtRem(row.rem) + '（至 ' + fmtDT(expTs) + '）</div>' +
      '<button class="mini" data-copy="' + esc(it.key) + '">复制</button>' +
      '<button class="mini danger" data-del="' + esc(it.key) + '">✕</button>';
    actBox.appendChild(div);
  }
  var expBox = document.getElementById('hist-expired');
  expBox.innerHTML = '';
  for (var k = 0; k < exp.length; k++) {
    var it2 = exp[k].e;
    var div2 = document.createElement('div');
    div2.className = 'row';
    div2.innerHTML = '<div class="ktag">' + esc(it2.tag || '（无备注）') + '</div><div class="kkey">' + esc(it2.key) + '</div>';
    expBox.appendChild(div2);
  }
  document.getElementById('hist-expired-box').hidden = exp.length === 0;
  actBox.onclick = function (ev) {
    var t = ev.target;
    if (t.dataset.copy) copyText(t.dataset.copy, t);
    if (t.dataset.del) { histSave(hist().filter(function (x) { return x.key !== t.dataset.del; })); renderHistory(); }
  };
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function copyText(text, btn) {
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  function done() {
    if (btn) { var old = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(function () { btn.textContent = old; }, 1500); }
  }
  if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); done(); }); }
  else { fallback(); done(); }
}
function clearExpired() {
  var now = Date.now();
  histSave(hist().filter(function (x) { return window.dkcAlgo.remainingMs(x.issueTime, x.validDays, now) > 0; }));
  renderHistory();
}

function doGen() {
  var tag = document.getElementById('tag').value;
  var days = parseInt(document.getElementById('days').value, 10);
  var rawDev = document.getElementById('device').value.trim();
  var dev = window.dkcAlgo.normalizeDeviceCode(rawDev);
  var hint = document.getElementById('device-hint');
  hint.hidden = true;
  if (rawDev && dev.length !== 32) {
    hint.textContent = '设备码格式不正确：应为 32 位十六进制字符（大小写与连字符不限）';
    hint.style.color = '#c0392b';
    hint.hidden = false;
    return;
  }
  var t = Math.floor(Date.now() / 60000) * 60000; // 与密钥内嵌时刻一致
  document.getElementById('nowtime').textContent = fmtDT(Date.now()); // 跨天打开时刷新
  var key = window.dkcAlgo.generate({ deviceCode: dev, validDays: days, issueTime: t });
  document.getElementById('key').textContent = key;
  document.getElementById('out').style.display = 'block';
  histSave(hist().concat([{ key: key, tag: tag, deviceCode: dev, validDays: Math.max(1, Math.min(63, days || 1)), issueTime: t }]));
  renderHistory();
}
function copyKey() { copyText(document.getElementById('key').textContent, document.getElementById('copy')); }

function tryUnlock() {
  var input = document.getElementById('pw').value;
  if (window.dkcAlgo.sha256HexText(input) === window.dkcAlgo.PASS_HASH) {
    try { sessionStorage.setItem(GATE_KEY, '1'); } catch (e) {}
    document.getElementById('gate').style.display = 'none';
  } else {
    document.getElementById('pw-msg').style.display = 'block';
    document.getElementById('pw').value = '';
  }
}

(function init() {
  document.getElementById('nowtime').textContent = fmtDT(Date.now());
  if (window.dkcAlgo.masterOk) {
    document.getElementById('fp').textContent = window.dkcAlgo.fingerprint;
  } else {
    document.getElementById('guard-err').hidden = false;
    document.getElementById('fp').textContent = '无效';
    document.getElementById('gen').disabled = true;
  }
  var unlocked = false;
  try { unlocked = sessionStorage.getItem(GATE_KEY) === '1'; } catch (e) {}
  if (unlocked) { document.getElementById('gate').style.display = 'none'; }
  renderHistory();
})();
</script>
</body>
</html>
